<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Calpinage panneaux — Débit optimisé</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="card">
    <h1 class="section-title">
      Calpinage panneaux
      <span class="info-tooltip" title="Optimisation du débit de panneaux (type Maxcut) : saisissez les dimensions du panneau et des pièces à débiter. Le calcul minimise les chutes et le nombre de panneaux." aria-label="Aide">ⓘ</span>
    </h1>
  </div>

  <div class="card">
    <label for="projectName">Nom du projet</label>
    <input id="projectName" type="text" placeholder="ex : Meuble cuisine — Éléments hauts">
    <form id="paramsForm" autocomplete="off">
      <h2>Paramètres de la découpe</h2>

      <fieldset class="group">
        <legend>Dimensions des panneaux (mm)</legend>
        <div class="row-4">
          <div>
            <label for="panelLength">Longueur</label>
            <input id="panelLength" type="number" min="1" step="1" value="2800" required>
          </div>
          <div>
            <label for="panelWidth">Largeur</label>
            <input id="panelWidth" type="number" min="1" step="1" value="1900" required>
          </div>
          <div>
            <label for="panelThickness">Épaisseur</label>
            <input id="panelThickness" type="number" min="0.1" step="0.5" value="19">
          </div>
          <div>
            <label for="sawKerf">Ép. lame (mm)</label>
            <input id="sawKerf" type="number" min="0" step="0.1" value="3">
          </div>
        </div>
        <div class="row-2">
          <div>
            <label for="panelCoating">Type de revêtement</label>
            <select id="panelCoating">
              <option value="melamine">Mélaminé</option>
              <option value="stratifie">Stratifié</option>
              <option value="contreplaque">Contreplaqué</option>
              <option value="mdf">MDF</option>
              <option value="osb">OSB</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div class="row-check" style="margin-top:0.8rem;">
            <input id="grainAlongLength" type="checkbox" title="Le fil du panneau reste parallèle à la longueur de chaque pièce (pas de rotation 90°).">
            <label for="grainAlongLength" class="inline-label">Sens du fil : fil dans le sens de la longueur de la pièce</label>
          </div>
        </div>
        <div class="row-2">
          <div>
            <label for="panelPrice">Prix par panneau (€)</label>
            <input id="panelPrice" type="number" min="0" step="0.01" placeholder="ex. 25" title="Coût matière = nombre de panneaux × prix par panneau">
          </div>
          <div>
            <label for="timePerCut">Temps par trait de scie (sec)</label>
            <input id="timePerCut" type="number" min="0" step="1" value="25" title="Pour l'estimation du temps de découpe">
          </div>
        </div>
        <div>
          <label for="timePerPanel">Temps de réglage par panneau (sec)</label>
          <input id="timePerPanel" type="number" min="0" step="1" value="60" title="Réglage machine par panneau">
        </div>
      </fieldset>

      <h2 class="section-title">
        Pièces à débiter
        <span class="info-tooltip" title="Ajoutez les pièces (longueur × largeur en mm). Choisissez le nom dans la liste, la quantité de 1 à 30. Cliquez sur un ou plusieurs bords de l'aperçu pour ajouter un chant à plaquer sur chaque côté." aria-label="Aide">ⓘ</span>
      </h2>
      <fieldset class="group">
        <legend>Liste des pièces</legend>

        <div id="piecesContainer" class="pieces-container">
          <div class="piece-row piece-row-header">
            <span class="piece-name">Nom</span>
            <span class="piece-qty">Qté</span>
            <span class="piece-length">Long. (mm)</span>
            <span class="piece-width">Larg. (mm)</span>
            <span class="piece-preview">Chants</span>
            <span class="piece-actions"></span>
          </div>
        </div>
        <div class="btnrow">
          <button id="addPieceBtn" type="button"><span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span> Ajouter une pièce</button>
        </div>
      </fieldset>

      <div class="btnrow">
        <button id="computeBtn" type="button"><span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 6h6M9 10h6M9 14h4"/></svg></span> Calculer le calpinage</button>
        <button id="resetBtn" type="reset"><span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></span> Réinitialiser</button>
      </div>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
  </div>

  <div id="output" class="card" style="display:none;"></div>

  <div class="card">
    <h2>Sauvegarde</h2>
    <div class="btnrow">
      <button id="saveProjectBtn" type="button"><span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span> Sauvegarder</button>
      <button id="exportJsonBtn" type="button"><span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span> Exporter JSON</button>
      <button id="importJsonBtn" type="button"><span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span> Importer JSON</button>
      <input id="importJsonFile" type="file" accept=".json" style="display:none;">
    </div>
    <div id="projectsList" class="projects"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <script src="js/solver2d.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
